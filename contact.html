<!DOCTYPE html>
<html>

<head>
    <title>Contact - Study Helper</title>

    <style>
        button {
            margin: 5px;
        }

        input {
            margin-bottom: 10px;
        }

        textarea {
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

    <h1>Study Helper</h1>

    <a href="index.html">Home</a>
    <a href="progress-page.html">Progress</a>
    <a href="contact.html">Contact</a>

    <h2>Contact Us</h2>

    <p>
        Have a question or suggestion about Study Helper?
        Send us a message below!
    </p>

    <p>Name</p>
    <input type="text" id="name">

    <p>Email</p>
    <input type="email" id="email">

    <p>Message</p>
    <textarea id="message" rows="5" cols="30"></textarea>

    <br>

    <button onclick="sendMessage()">Submit</button>

    <p id="response"></p>

    <script>
        function sendMessage() {
            document.getElementById("response").innerHTML =
            "Thank you! Your message has been submitted.";
        }
    </script>

</body>

</html>
